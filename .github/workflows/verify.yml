name: Verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Apply D1 migrations to a disposable local database
        run: |
          cp wrangler.example.toml wrangler.toml
          sed -i 's/REPLACE_WITH_REAL_D1_DATABASE_ID/00000000-0000-0000-0000-000000000000/' wrangler.toml
          npx wrangler d1 migrations apply workshop-visitor-terminal --local --config wrangler.toml
          npx wrangler d1 execute workshop-visitor-terminal --local --config wrangler.toml --command "SELECT COUNT(*) AS total FROM counters;"
      - name: Validate staging-only configuration safety offline
        run: node --test worker/*.test.mjs
      - name: Temporary read-only staging response diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/staging-health-readiness'
        continue-on-error: true
        run: |
          node --input-type=module -e '
            import { describeResponse } from "./worker/health-preflight.mjs";
            try {
              const response = await fetch("https://workshop-visitor-terminal-staging.fangcui2007.workers.dev/health", { redirect: "manual", signal: AbortSignal.timeout(12000) });
              console.log("Current /health:", describeResponse(response, await response.text()));
            } catch (error) {
              console.log("Current /health network failure:", error.name);
            }
          '
      - run: npm test
      - run: npm run build
      - name: Exercise real local Worker and persistent D1 across restart
        run: node worker/local-smoke.mjs
