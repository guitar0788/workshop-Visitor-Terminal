name: Publish Workshop Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Never cancel an in-flight OAuth Pilot Pages publication.
  group: github-pages
  cancel-in-progress: false

jobs:
  release_gate:
    name: Check pilot/preview Pages release channel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish_preview: ${{ steps.channel.outputs.publish_preview }}
    steps:
      - name: Checkout release channel
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decide whether ordinary preview may deploy
        id: channel
        run: node worker/decide-pages-deploy.mjs

  deploy:
    name: Build and publish editor
    needs: release_gate
    if: needs.release_gate.outputs.publish_preview == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Add downloadable, single-file offline editor
        run: npm run build:offline
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
